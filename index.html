<!-- انترو اللعبة: بيظهر أول ما اللعبة تفتح ~2.6 ثانية، والضغط بيقفله -->
<div id="intro" aria-hidden="true" translate="no" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,#6b3fd4 0,#34205f 45%,#150c26 85%);overflow:hidden;transition:opacity .5s ease">
  <style>
    #intro .rays{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg at 50% 50%,#ffffff1c 0 8deg,transparent 8deg 22deg);animation:introSpin 14s linear infinite}
    #intro img{width:min(46vw,230px);height:auto;border-radius:24%;box-shadow:0 18px 60px #0009,0 0 0 4px #ffd54a55;animation:introPop .9s cubic-bezier(.2,1.6,.4,1) both,introPulse 1.6s .9s ease-in-out infinite}
    #intro h1{font-family:'Lalezar','Cairo',system-ui,sans-serif;font-size:min(13vw,64px);color:#ffd54a;margin:26px 0 4px;text-shadow:0 6px 0 #7a4a00,0 14px 30px #0008;animation:introUp .6s .55s ease-out both}
    #intro p{font-family:'Cairo',system-ui,sans-serif;font-weight:700;color:#e9dcff;font-size:min(4.6vw,20px);margin:0;animation:introUp .6s .8s ease-out both}
    #intro .bar{width:min(50vw,220px);height:8px;border-radius:8px;background:#ffffff22;margin-top:30px;overflow:hidden;animation:introUp .4s 1s ease-out both}
    #intro .bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#ffd54a,#ff6f61);animation:introLoad 1.4s 1.1s ease-in-out forwards}
    @keyframes introSpin{to{transform:rotate(360deg)}}
    @keyframes introPop{0%{transform:scale(0) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
    @keyframes introPulse{50%{transform:scale(1.06)}}
    @keyframes introUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
    @keyframes introLoad{to{width:100%}}
    @media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}}
  </style>

<script>
(function(){var el=document.getElementById("intro");if(!el)return;
  function done(){if(!el)return;var e=el;el=null;e.style.opacity="0";e.style.pointerEvents="none";setTimeout(function(){e.remove()},550);}
  if(navigator.webdriver){el.remove();el=null;return;}
  var lang;try{lang=JSON.parse(localStorage.getItem("mal3ab_lang"))}catch(e){}
  if(lang!=="ar"&&lang!=="en"){var n=(navigator.languages&&navigator.languages[0])||navigator.language||"ar";lang=/^ar/i.test(n)?"ar":"en";}
  if(lang==="en"){el.dir="ltr";document.getElementById("introT").textContent="Brain Arena";document.getElementById("introS").textContent="Challenge your brain. Beat your friends!";}
  el.addEventListener("click",done);setTimeout(done,2700);})();
</script>

<div id="app" dir="rtl">
  <section id="home" class="screen">
    <div class="brand">
      <h1>ملعب المخ</h1>
      <button class="sound" id="langQuick" type="button" translate="no" aria-label="Language">EN</button>
      <button class="sound" id="soundBtn" type="button">الصوت: شغّال</button>
    </div>
    <button class="chip-player" id="homePlayer" type="button" aria-label="ملفي"></button>
    <button class="continue" id="continueBtn" type="button"></button>
    <button class="daily-card" id="dailyBtn" type="button"></button>

    <h2 class="h2">لعب حر</h2>
    <button class="card" data-g="speed" type="button">
      <div><div class="nm">أسرع مخ</div><div class="ds">أسئلة خاطفة ورا بعض: حساب، ألوان، وأنهي أكبر. كل إجابة صح بتديك وقت زيادة.</div><div class="bs" data-best="speed"></div></div>
      <div class="art"><span class="art-eq">7+5=12</span></div>
    </button>
    <button class="card" data-g="pop" type="button">
      <div><div class="nm">فرقع</div><div class="ds">دوس على مجموعة حلويات من نفس اللون. كل ما المجموعة أكبر، النقط تضاعف. 6 أو أكتر تعمل قنبلة.</div><div class="bs" data-best="pop"></div></div>
      <div class="art"><div class="art-grid"><i class="c1"></i><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c3"></i><i class="c2"></i></div></div>
    </button>
    <button class="card" data-g="mem" type="button">
      <div><div class="nm">افتكر</div><div class="ds">مربعات بتنوّر لحظة وتطفي. افتكرها كلها. كل مستوى بيزيد مربع.</div><div class="bs" data-best="mem"></div></div>
      <div class="art"><div class="art-grid"><i></i><i class="lit"></i><i></i><i class="lit"></i><i></i><i></i><i></i><i></i><i class="lit"></i></div></div>
    </button>
    <button class="card" data-g="word" type="button">
      <div><div class="nm">كوّن كلمة</div><div class="ds">حروف متلخبطة قدامك. دوس عليها بالترتيب وكوّن كل الكلمات المخبّية قبل الوقت ما يخلص.</div><div class="bs" data-best="word"></div></div>
      <div class="art"><div class="art-ring" translate="no"><b>ق</b><b>ل</b><b>ب</b></div></div>
    </button>

    <div class="soon-row">
      <button class="soon live" type="button" id="questsBtn">المهام<small id="questsSub"></small></button>
      <button class="soon live" type="button" id="achBtn">الإنجازات<small id="achSub"></small></button>
      <button class="soon live" type="button" id="onlineBtn">العب مع صاحبك<small>أونلاين بكود</small></button>
      <button class="soon live" type="button" id="socialBtn">الأصحاب والترتيب<small>لوحة الأبطال</small></button>
    </div>
  </section>

  <section id="map" class="screen" hidden></section>
  <section id="profile" class="screen" hidden></section>
  <section id="settings" class="screen" hidden></section>
  <section id="quests" class="screen" hidden></section>
  <section id="online" class="screen" hidden></section>
  <section id="social" class="screen" hidden></section>

  <section id="play" hidden>
    <div class="top">
      <button class="back" id="backBtn" type="button" aria-label="رجوع">›</button>
      <div class="gname" id="hudTitle"></div>
      <div class="score" id="hudScore">0</div>
    </div>
    <div class="info" id="hudInfo"></div>
    <div class="vs" id="vs" hidden></div>
    <div class="barwrap" id="barWrap"><div class="bar" id="hudBar"></div></div>
    <div class="stage" id="stage"></div>
  </section>

  <nav class="nav" id="nav" aria-label="التنقل">
    <button type="button" data-go="home"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>الرئيسية</button>
    <button type="button" data-go="map"><svg viewBox="0 0 24 24"><path d="m3 6 6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg>المستويات</button>
    <button type="button" data-go="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>ملفي</button>
    <button type="button" data-go="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>الإعدادات</button>
  </nav>
</div>

    <div class="t">النتيجة</div>
