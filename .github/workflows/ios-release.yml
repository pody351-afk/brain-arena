# رفع التطبيق لـ TestFlight / App Store Connect. بيشتغل يدوي بس (من تبويب Actions ← Run workflow).
# محتاج 4 أسرار في Settings ← Secrets and variables ← Actions (مش في الكود أبدًا):
#   APPLE_TEAM_ID · ASC_KEY_ID · ASC_ISSUER_ID · ASC_KEY_P8 (محتوى ملف .p8 كامل)
#   BUNDLE_ID اختياري، الافتراضي com.emsekharamy.brainarena
# التوقيع بيتعمل بـ fastlane من خلال App Store Connect API (fastlane/Fastfile).
name: ios-release
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "رقم البناء (لازم يزيد في كل رفع)"
        required: true
        default: "1"
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Check secrets
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -n "${!v}" ] || { echo "سر ناقص: $v"; exit 1; }; done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Set bundle id
        run: |
          BID="${{ secrets.BUNDLE_ID }}"; [ -n "$BID" ] || BID="com.emsekharamy.brainarena"
          echo "BUNDLE_ID=$BID" >> "$GITHUB_ENV"
          node -e "const f='capacitor.config.json',c=require('./'+f);c.appId='$BID';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - run: npm run ios:add
      - name: Build and upload (fastlane)
        run: fastlane ios release
